name = "tw-stock-mcp"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 部署時保留在 Cloudflare 後台設定的變數，避免每次 push 被清掉
keep_vars = true

# 金鑰類設定一律用 Secret，不要寫在這裡：
#   FUGLE_API_KEY  富果行情 API 金鑰
#   MCP_TOKEN      隨機字串（至少 16 字元），連接器網址為 /mcp/<MCP_TOKEN>

[observability]
enabled = true

# 當沖盤中監控：狀態存在 SQLite 版 Durable Object（免費方案可用）
[[durable_objects.bindings]]
name = "MONITOR"
class_name = "WatchMonitor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchMonitor"]

# 每分鐘執行；UTC 01:00–05:59 = 台北 09:00–13:59，平日。程式內再限縮到 09:01–13:25
[triggers]
crons = ["* 1-5 * * 1-5"]

# 通知用 Secret（在 Cloudflare 後台新增）：
#   TELEGRAM_BOT_TOKEN  Telegram Bot 的 token
#   TELEGRAM_CHAT_ID    Telegram chat id，可填多個並以逗號分隔（例：個人 id,-100頻道 id）
